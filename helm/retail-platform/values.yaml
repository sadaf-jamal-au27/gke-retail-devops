# Defaults — override per env with values-<env>.yaml
global:
  projectId: YOUR_GCP_PROJECT_ID
  region: asia-south1
  env: prod
  namespace: retail
  imageRegistry: asia-south1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/retail
  imageTag: "1.0.0"
  imagePullPolicy: IfNotPresent

  cloudSql:
    instanceConnectionName: PROJECT:REGION:retail-prod-pg
    privateIp: ""
    proxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1

  serviceAccount:
    create: true
    name: retail-app
    gsaEmail: retail-workload@YOUR_GCP_PROJECT_ID.iam.gserviceaccount.com

  podSecurity:
    runAsNonRoot: true
    runAsUser: 65532
    readOnlyRootFilesystem: true

  # Autopilot-legal shape (CPU:memory ratio)
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 512Mi

  networkPolicy:
    enabled: true

gateway:
  enabled: false
  hostname: shop.example.com
  adminHostname: admin.example.com

bff:
  exposeViaGateway: true
  replicas: 1

# Overridden by services.live-12.yaml (or services.generated.yaml)
services: []
