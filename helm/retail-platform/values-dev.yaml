global:
  env: dev
  namespace: retail-dev
  projectId: ai-rag-agent-project
  imageRegistry: asia-south1-docker.pkg.dev/ai-rag-agent-project/retail
  imageTag: develop-latest
  imagePullPolicy: Always
  cloudSql:
    instanceConnectionName: ai-rag-agent-project:asia-south1:retail-dev-pg
    # Same VPC as GKE Autopilot — connect without Auth Proxy sidecar.
    privateIp: "10.40.0.3"
    proxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
  serviceAccount:
    gsaEmail: retail-workload-dev@ai-rag-agent-project.iam.gserviceaccount.com

gateway:
  enabled: false
  hostname: dev-shop.example.com
  adminHostname: dev-admin.example.com

bff:
  replicas: 1
