{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ .name }}
    domain: {{ .domain }}
    {{- include "retail.labels" $ | nindent 4 }}
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
        domain: {{ .domain }}
        {{- include "retail.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: {{ $.Values.global.serviceAccount.name }}
      securityContext:
        runAsNonRoot: {{ $.Values.global.podSecurity.runAsNonRoot }}
        runAsUser: {{ $.Values.global.podSecurity.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .name }}
          image: "{{ include "retail.image" (dict "name" .name "Values" $.Values) }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: PORT
              value: "{{ .port }}"
            - name: GOOGLE_CLOUD_PROJECT
              value: "{{ $.Values.global.projectId }}"
            - name: PUBSUB_TOPIC_PREFIX
              value: retail
            - name: LOG_LEVEL
              value: info
            - name: CORS_ORIGINS
              value: "https://{{ $.Values.gateway.hostname }},https://{{ $.Values.gateway.adminHostname }}"
            {{- if eq .name "bff-api-service" }}
            {{- /* In-cluster ClusterIP DNS (service port 80 → container 8080) */}}
            - name: AUTH_URL
              value: http://auth-service
            - name: VEHICLE_CATALOG_URL
              value: http://vehicle-catalog-service
            - name: VEHICLE_INVENTORY_URL
              value: http://vehicle-inventory-service
            - name: DEALERSHIP_URL
              value: http://dealership-service
            - name: AUTO_PRICING_URL
              value: http://auto-pricing-service
            - name: TEST_DRIVE_URL
              value: http://test-drive-service
            - name: AUTO_CART_URL
              value: http://auto-cart-service
            - name: AUTO_ORDER_URL
              value: http://auto-order-service
            - name: AUTO_FINANCE_URL
              value: http://auto-finance-service
            - name: SERVICE_APPOINTMENT_URL
              value: http://service-appointment-service
            - name: TRADE_IN_URL
              value: http://trade-in-service
            {{- end }}
            {{- /* DB: private VPC IP (preferred on Autopilot same-VPC) or 127.0.0.1 via Auth Proxy sidecar */}}
            {{- if or .enableDatabase .enableCloudSqlProxy }}
            - name: DB_HOST
              value: {{ if .enableCloudSqlProxy }}"127.0.0.1"{{ else }}{{ $.Values.global.cloudSql.privateIp | quote }}{{ end }}
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: retail_app
            - name: DB_NAME
              value: retail
            - name: DB_SSL
              value: "false"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retail-db
                  key: password
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $.Values.global.podSecurity.readOnlyRootFilesystem }}
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.global.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if .enableCloudSqlProxy }}
        - name: cloud-sql-proxy
          image: {{ $.Values.global.cloudSql.proxyImage }}
          args:
            - "--structured-logs"
            - "--private-ip"
            - "{{ $.Values.global.cloudSql.instanceConnectionName }}"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ .name }}
    domain: {{ .domain }}
    {{- include "retail.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: {{ .name }}
  ports:
    - port: 80
      targetPort: http
      name: http
{{- end }}
